name: Publish Friday Article

on:
  schedule:
    - cron: '30 14 * * 5'  # Friday 14:30 UTC. Tools :00, QR :15, this :30 - they share one Groq key (TPM limit)
    - cron: '30 14 * * 6'  # Saturday backup: does nothing if an article already went out since Friday
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run every gate but do not push'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the Saturday guard reads this week's history

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pick topic
        id: topic
        run: |
          NEXT=$(ls _scheduled/*.tsx 2>/dev/null | sort | head -1)
          if [ -n "$NEXT" ]; then
            FILENAME=$(basename "$NEXT" .tsx)
            SLUG=$(echo "$FILENAME" | sed 's/^[0-9-]*_//')
            mkdir -p "src/app/blog/$SLUG"
            mv "$NEXT" "src/app/blog/$SLUG/page.tsx"
            echo "slug=$SLUG" >> $GITHUB_OUTPUT
            echo "source=scheduled" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Backup del sabado: si ya entro un articulo desde el viernes de esta
          # semana (el run del viernes o uno a mano), no hacer nada.
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            FRIDAY=$(date -u -d "$(( $(date -u +%u) - 5 )) days ago" +%F)
            if [ -n "$(git log --since="${FRIDAY}T00:00:00Z" --diff-filter=A --name-only --format= -- 'src/app/blog/*/page.tsx')" ]; then
              echo "::notice::ya se publico un articulo desde el viernes $FRIDAY, nada que hacer"
              echo "source=none" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          WEEK=$(date +%V | sed 's/^0*//')

          TOPICS=(
            "Understanding escrow: what it is and why your payment includes it"
            "Mortgage pre-approval vs pre-qualification: the real difference"
            "Should I rent or buy in 2026? A financial decision framework"
            "How to calculate your debt-to-income ratio for mortgage approval"
            "How mortgage interest deductions work in 2026"
            "First-time homebuyer programs: which ones actually help"
            "How to compare mortgage offers: APR vs interest rate explained"
            "What happens at closing: a step-by-step walkthrough"
            "How to negotiate a lower mortgage rate"
            "Cash-out refinancing: when it makes sense and when it is a trap"
            "HELOC vs home equity loan: choosing the right option"
            "How property taxes are calculated and how to appeal them"
            "How to read your mortgage statement"
            "What credit score do you need to buy a house in 2026"
            "The hidden costs of buying a home beyond the mortgage payment"
            "How inflation affects mortgage rates"
            "Biweekly mortgage payments: do they actually save money"
            "How to handle mortgage payments during financial hardship"
            "How mortgage amortization really works with a real example"
            "Down payment assistance programs by state"
            "How to get a mortgage as a self-employed borrower"
            "What is a mortgage escrow shortage and how to fix it"
            "How to calculate the true cost of a 30-year mortgage"
            "Conventional loans: the complete guide for 2026"
            "How to buy a house with bad credit"
            "What happens to your mortgage if your lender goes bankrupt"
            "Home inspection vs appraisal: what buyers need to know"
            "How to avoid overpaying for a house in a hot market"
            "Construction loans: how they work and what to watch out for"
            "Reverse mortgages explained: who they help and who they hurt"
            "Mobile home mortgages: financing options and what to expect"
            "How mortgage forbearance works and when to request it"
            "Multi-family property mortgages: house hacking explained"
            "What is title insurance and do you need it"
            "How to protect yourself from mortgage fraud"
            "Condo mortgages: how they differ from single-family loans"
            "What is a mortgage contingency and should you waive it"
            "How to calculate equity and net worth from your home"
            "Portfolio loans: when banks hold your mortgage instead of selling it"
          )

          # Hasta 3 temas sin publicar, empezando por el slot de esta semana. Si
          # uno es rechazado, el paso siguiente prueba el proximo en el mismo
          # run: un rechazo ya no pierde la semana. Un tema ya publicado se salta.
          N=${#TOPICS[@]}
          IDX=$(( ($WEEK - 1) % N ))
          : > "$RUNNER_TEMP/candidates.tsv"
          COUNT=0
          for i in $(seq 0 $((N - 1))); do
            CAND="${TOPICS[$(( (IDX + i) % N ))]}"
            CSLUG=$(echo "$CAND" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9 ]//g' | tr ' ' '-' | sed 's/--*/-/g' | cut -c1-60)
            if [ ! -f "src/app/blog/$CSLUG/page.tsx" ]; then
              printf '%s\t%s\n' "$CSLUG" "$CAND" >> "$RUNNER_TEMP/candidates.tsv"
              COUNT=$((COUNT + 1))
              if [ $COUNT -ge 3 ]; then break; fi
            fi
          done
          if [ $COUNT -eq 0 ]; then
            echo "::error::todos los temas de TOPICS ya estan publicados; agregar temas nuevos"
            exit 1
          fi
          cat "$RUNNER_TEMP/candidates.tsv"
          echo "source=generated" >> $GITHUB_OUTPUT

      # Groq inventa datos todas las semanas (credenciales del autor, casos con
      # porcentajes, limites de competidores, funciones que el sitio no tiene).
      # Por tema: generar + validar -> fact-check -> build. Claude Code revisa el
      # borrador contra scripts/site_facts.md y lo corrige; si despues de 4
      # pasadas sigue habiendo problemas, ese tema se descarta. El fact-check usa
      # la suscripcion Claude (token de `claude setup-token`), NUNCA la API paga
      # de Anthropic: por eso no hay ANTHROPIC_API_KEY en este paso. El build
      # es el gate que faltaba: antes el articulo roto llegaba a main.
      - name: Generate, fact-check, build (up to 3 topics)
        id: gen
        if: steps.topic.outputs.source == 'generated'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::error::GROQ_API_KEY no esta seteado"
            exit 1
          fi
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::falta el secret CLAUDE_CODE_OAUTH_TOKEN (claude setup-token)"
            exit 1
          fi
          npm install -g @anthropic-ai/claude-code
          env -u NODE_ENV npm ci
          # fd 3: que ningun comando del loop se coma la lista por stdin
          while IFS=$'\t' read -r SLUG TOPIC <&3; do
            echo "::group::$TOPIC"
            if TOPIC="$TOPIC" SLUG="$SLUG" TODAY=$(date +%Y-%m-%d) python3 scripts/generate_article.py \
               && SLUG="$SLUG" python3 scripts/review_article.py \
               && npm run build; then
              echo "::endgroup::"
              echo "slug=$SLUG" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::rechazado: $TOPIC. Probando el siguiente tema."
            git checkout -- src/app
            git clean -fdq -- src/app
          done 3< "$RUNNER_TEMP/candidates.tsv"
          echo "::error::ninguno de los temas paso validacion + fact-check + build"
          exit 1

      - name: Build gate (scheduled article)
        if: steps.topic.outputs.source == 'scheduled'
        run: |
          env -u NODE_ENV npm ci
          npm run build

      - name: Commit and push
        if: steps.topic.outputs.source != 'none' && !inputs.dry_run
        run: |
          git config user.name "Klickify Agency Bot"
          git config user.email "info@klickifyagency.com"
          SLUG="${{ steps.gen.outputs.slug || steps.topic.outputs.slug }}"
          git add "src/app/blog/$SLUG" "src/app/sitemap.ts" "src/app/blog/page.tsx"
          git add -u _scheduled 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "publish: weekly article - $SLUG"
            # el run dura hasta ~25 min: si alguien pusheo a main mientras, rebase
            git pull --rebase origin main
            git push
          fi

      - name: Dry run result
        if: inputs.dry_run
        run: echo "::notice::dry run - ${{ steps.gen.outputs.slug || steps.topic.outputs.slug }} paso todos los gates, no se pusheo"

      - name: Report failure
        if: failure()
        run: |
          echo "::error::El articulo de esta semana NO se publico. Revisar el log:"
          echo "::error::los temas candidatos fueron rechazados (validacion, fact-check o build). Nada fue pusheado."
          ls -la _rejected_*.tsx 2>/dev/null && cat _rejected_*.tsx | head -60 || true
